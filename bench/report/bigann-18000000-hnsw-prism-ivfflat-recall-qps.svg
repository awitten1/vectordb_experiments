<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Recall vs throughput — pgvector HNSW vs PRISM vs pgvector IVFFlat on bigann_18000000</title>
<desc id="d">Single-client recall/throughput tradeoff. pgvector HNSW ef 10: recall 0.6227, 2,617 QPS, ef 20: recall 0.7532, 1,762 QPS, ef 40: recall 0.8551, 1,116 QPS, ef 80: recall 0.9263, 650 QPS, ef 160: recall 0.9686, 364 QPS, ef 320: recall 0.9891, 204 QPS; PRISM np 5: recall 0.6439, 6,433 QPS, np 10: recall 0.7838, 4,505 QPS, np 20: recall 0.8826, 3,058 QPS, np 40: recall 0.9437, 2,074 QPS, np 80: recall 0.9781, 1,382 QPS, np 160: recall 0.9923, 837 QPS, np 320: recall 0.9970, 473 QPS; pgvector IVFFlat pr 1: recall 0.3630, 720 QPS, pr 2: recall 0.5212, 372 QPS, pr 5: recall 0.7067, 149 QPS, pr 10: recall 0.8254, 73 QPS, pr 20: recall 0.9097, 37 QPS, pr 50: recall 0.9710, 16 QPS, pr 100: recall 0.9905, 8 QPS.</desc>
