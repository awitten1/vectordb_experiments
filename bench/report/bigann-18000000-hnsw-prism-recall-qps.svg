<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Recall vs throughput — pgvector HNSW vs PRISM on bigann_18000000</title>
<desc id="d">Single-client recall/throughput tradeoff. pgvector HNSW ef 10: recall 0.6227, 2,617 QPS, ef 20: recall 0.7532, 1,762 QPS, ef 40: recall 0.8551, 1,116 QPS, ef 80: recall 0.9263, 650 QPS, ef 160: recall 0.9686, 364 QPS, ef 320: recall 0.9891, 204 QPS; PRISM np 5: recall 0.6439, 6,433 QPS, np 10: recall 0.7838, 4,505 QPS, np 20: recall 0.8826, 3,058 QPS, np 40: recall 0.9437, 2,074 QPS, np 80: recall 0.9781, 1,382 QPS, np 160: recall 0.9923, 837 QPS, np 320: recall 0.9970, 473 QPS.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--series1:#2a78d6;--series2:#eb6834;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--series1:#3987e5;--series2:#d95926;}}
:root[data-theme="dark"]{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--series1:#3987e5;--series2:#d95926;}
.bg{fill:var(--surface)}
.ttl{fill:var(--ink);font-size:19px;font-weight:600}
.sub{fill:var(--ink2);font-size:12.5px}
.foot{fill:var(--muted);font-size:11.5px}
.axlbl{fill:var(--ink2);font-size:12.5px;font-weight:500}
.tick{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.lgnd{fill:var(--ink);font-size:12.5px;font-weight:500}
.line1{fill:none;stroke:var(--series1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot1{fill:var(--series1);stroke:var(--surface);stroke-width:2}
.sw1{fill:var(--series1)}
.line2{fill:none;stroke:var(--series2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot2{fill:var(--series2);stroke:var(--surface);stroke-width:2}
.sw2{fill:var(--series2)}
.plbl{fill:var(--ink);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
