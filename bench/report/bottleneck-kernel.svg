<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 446" width="860" height="446" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">The distance arithmetic is not the bottleneck</title><desc id="d">Grouped bars: cached and from-DRAM time for pgvector's kernel and a four-accumulator version.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}}
:root[data-theme="dark"]{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
.bg{fill:var(--surface)} .ttl{fill:var(--ink);font-size:18px;font-weight:600}.sub{fill:var(--ink2);font-size:12.5px} .tick{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums} .axlbl{fill:var(--ink2);font-size:12.5px;font-weight:500}.lbl{fill:var(--ink);font-size:12.5px;font-weight:600} .val{fill:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums} .note{fill:var(--muted);font-size:11.5px}.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}.ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.band{fill:var(--muted);opacity:.14}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .f1{fill:var(--s1)}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d2{fill:var(--s2);stroke:var(--surface);stroke-width:2} .f2{fill:var(--s2)}
.l3{fill:none;stroke:var(--s3);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d3{fill:var(--s3);stroke:var(--surface);stroke-width:2} .f3{fill:var(--s3)}
.l4{fill:none;stroke:var(--s4);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d4{fill:var(--s4);stroke:var(--surface);stroke-width:2} .f4{fill:var(--s4)}
.l5{fill:none;stroke:var(--s5);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d5{fill:var(--s5);stroke:var(--surface);stroke-width:2} .f5{fill:var(--s5)}
.l6{fill:none;stroke:var(--s6);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d6{fill:var(--s6);stroke:var(--surface);stroke-width:2} .f6{fill:var(--s6)}
.l7{fill:none;stroke:var(--s7);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d7{fill:var(--s7);stroke:var(--surface);stroke-width:2} .f7{fill:var(--s7)}
.l8{fill:none;stroke:var(--s8);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d8{fill:var(--s8);stroke:var(--surface);stroke-width:2} .f8{fill:var(--s8)}
.dash{stroke-dasharray:7 4}
</style>
<rect class="bg" x="0" y="0" width="860" height="446"/>
<text class="ttl" x="24" y="32">The distance arithmetic is not the bottleneck</text>
<text class="sub" x="24" y="52">Time per 1536-d L2 distance, one thread. pgvector's kernel verbatim, built with pgvector's flags.</text>
<line class="grid" x1="96" x2="640" y1="350.0" y2="350.0"/>
<text class="tick" x="88.0" y="354.0" text-anchor="end">0</text>
<line class="grid" x1="96" x2="640" y1="288.5" y2="288.5"/>
<text class="tick" x="88.0" y="292.5" text-anchor="end">200</text>
<line class="grid" x1="96" x2="640" y1="227.0" y2="227.0"/>
<text class="tick" x="88.0" y="231.0" text-anchor="end">400</text>
<line class="grid" x1="96" x2="640" y1="165.5" y2="165.5"/>
<text class="tick" x="88.0" y="169.5" text-anchor="end">600</text>
<line class="grid" x1="96" x2="640" y1="104.0" y2="104.0"/>
<text class="tick" x="88.0" y="108.0" text-anchor="end">800</text>
<line class="axis" x1="96" x2="640" y1="350" y2="350"/>
<text class="axlbl" transform="translate(44 227.0) rotate(-90)" text-anchor="middle">ns per distance</text>
<rect class="f1" x="136" y="212.5" width="72" height="137.5" rx="3"/>
<text class="val" x="172.0" y="204.5" text-anchor="middle">447</text>
<rect class="f3" x="212" y="309.7" width="72" height="40.3" rx="3"/>
<text class="val" x="248.0" y="301.7" text-anchor="middle">131</text>
<text class="lbl" x="210.0" y="370.0" text-anchor="middle">vectors in cache</text>
<rect class="f1" x="396" y="122.1" width="72" height="227.9" rx="3"/>
<text class="val" x="432.0" y="114.1" text-anchor="middle">741</text>
<rect class="f3" x="472" y="128.9" width="72" height="221.1" rx="3"/>
<text class="val" x="508.0" y="120.9" text-anchor="middle">719</text>
<text class="lbl" x="470.0" y="370.0" text-anchor="middle">vectors from DRAM (the real case)</text>
<rect class="f1" x="96" y="82" width="12" height="12" rx="2"/>
<text class="val" x="114.0" y="92.0" text-anchor="start">pgvector kernel (1 accumulator)</text>
<rect class="f3" x="343" y="82" width="12" height="12" rx="2"/>
<text class="val" x="361.0" y="92.0" text-anchor="start">4 accumulators</text>
<text class="note" x="24.0" y="404.0" text-anchor="start">In cache, pgvector's single accumulator serializes 192 FMAs (≈4.7 cycles each); four accumulators are 3.4× faster.</text>
<text class="note" x="24.0" y="422.0" text-anchor="start">From DRAM both take ~0.73 µs, the time to stream 6 KB, and that matches the 0.67 µs measured inside real queries.</text>
</svg>
