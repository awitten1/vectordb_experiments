<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Each visited element costs 2.1 µs of server CPU</title><desc id="d">Horizontal bars of microseconds per visited element by category.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}}
:root[data-theme="dark"]{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
.bg{fill:var(--surface)} .ttl{fill:var(--ink);font-size:18px;font-weight:600}.sub{fill:var(--ink2);font-size:12.5px} .tick{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums} .axlbl{fill:var(--ink2);font-size:12.5px;font-weight:500}.lbl{fill:var(--ink);font-size:12.5px;font-weight:600} .val{fill:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums} .note{fill:var(--muted);font-size:11.5px}.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}.ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.band{fill:var(--muted);opacity:.14}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .f1{fill:var(--s1)}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d2{fill:var(--s2);stroke:var(--surface);stroke-width:2} .f2{fill:var(--s2)}
.l3{fill:none;stroke:var(--s3);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d3{fill:var(--s3);stroke:var(--surface);stroke-width:2} .f3{fill:var(--s3)}
.l4{fill:none;stroke:var(--s4);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d4{fill:var(--s4);stroke:var(--surface);stroke-width:2} .f4{fill:var(--s4)}
.l5{fill:none;stroke:var(--s5);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d5{fill:var(--s5);stroke:var(--surface);stroke-width:2} .f5{fill:var(--s5)}
.l6{fill:none;stroke:var(--s6);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d6{fill:var(--s6);stroke:var(--surface);stroke-width:2} .f6{fill:var(--s6)}
.l7{fill:none;stroke:var(--s7);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d7{fill:var(--s7);stroke:var(--surface);stroke-width:2} .f7{fill:var(--s7)}
.l8{fill:none;stroke:var(--s8);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d8{fill:var(--s8);stroke:var(--surface);stroke-width:2} .f8{fill:var(--s8)}
.dash{stroke-dasharray:7 4}
</style>
<rect class="bg" x="0" y="0" width="860" height="470"/>
<text class="ttl" x="24" y="32">Each visited element costs 2.1 µs of server CPU</text>
<text class="sub" x="24" y="52">1 client, ef_search=640: 8,555 elements and 17.8 ms of server CPU per query. Self time by category, from call-graph samples.</text>
<text class="lbl" x="288.0" y="101.0" text-anchor="end">Distance (streams the 6 KB vector)</text>
<rect class="f1" x="300" y="88" width="336.0" height="22" rx="3"/>
<text class="val" x="644.0" y="101.0" text-anchor="start">0.67 µs  (32%)</text>
<text class="lbl" x="288.0" y="135.0" text-anchor="end">Buffer manager: page lookup</text>
<rect class="f1" x="300" y="122" width="189.3" height="22" rx="3"/>
<text class="val" x="497.3" y="135.0" text-anchor="start">0.38 µs  (18%)</text>
<text class="lbl" x="288.0" y="169.0" text-anchor="end">HNSW element and neighbor loading</text>
<rect class="f1" x="300" y="156" width="182.1" height="22" rx="3"/>
<text class="val" x="490.1" y="169.0" text-anchor="start">0.36 µs  (18%)</text>
<text class="lbl" x="288.0" y="203.0" text-anchor="end">Buffer manager: pin, locks, refcounts</text>
<rect class="f1" x="300" y="190" width="158.1" height="22" rx="3"/>
<text class="val" x="466.1" y="203.0" text-anchor="start">0.32 µs  (15%)</text>
<text class="lbl" x="288.0" y="237.0" text-anchor="end">Executor, protocol, other</text>
<rect class="f1" x="300" y="224" width="59.3" height="22" rx="3"/>
<text class="val" x="367.3" y="237.0" text-anchor="start">0.12 µs  (6%)</text>
<text class="lbl" x="288.0" y="271.0" text-anchor="end">Visited set</text>
<rect class="f1" x="300" y="258" width="54.1" height="22" rx="3"/>
<text class="val" x="362.1" y="271.0" text-anchor="start">0.11 µs  (5%)</text>
<text class="lbl" x="288.0" y="305.0" text-anchor="end">Kernel</text>
<rect class="f1" x="300" y="292" width="28.1" height="22" rx="3"/>
<text class="val" x="336.1" y="305.0" text-anchor="start">0.06 µs  (3%)</text>
<text class="lbl" x="288.0" y="339.0" text-anchor="end">Candidate queues</text>
<rect class="f1" x="300" y="326" width="27.0" height="22" rx="3"/>
<text class="val" x="335.0" y="339.0" text-anchor="start">0.05 µs  (3%)</text>
<text class="lbl" x="288.0" y="373.0" text-anchor="end">Memory allocation</text>
<rect class="f1" x="300" y="360" width="4.2" height="22" rx="3"/>
<text class="val" x="312.2" y="373.0" text-anchor="start">0.01 µs  (0%)</text>
<text class="note" x="24.0" y="404.0" text-anchor="start">Overlapping all of these: page-table walks take 12.7% of cycles (~5.5 dTLB misses per element; shared_buffers is mapped with 4 KB pages).</text>
<text class="note" x="24.0" y="422.0" text-anchor="start">The two buffer-manager rows are one cost: finding, pinning and locking each element's page. Together, 33%.</text>
</svg>
