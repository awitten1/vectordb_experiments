<text class="foot" x="24" y="530">Optimistic reads cut instructions ~60%; prefetch leaves instructions and cache misses (~25k/query) unchanged but lifts instructions per cycle (IPC) 0.38 → 1.31 by overlapping misses.</text>
<text class="foot" x="24" y="548">Postgres 18.6 · pgvector 0.8.7 vs pgvectorfast a704e32 · 60s per QPS point · counters: perf stat over a 40s 1-client window, steady-state median, multiplexed (scaled) · AMD Ryzen 9 9900X</text>
