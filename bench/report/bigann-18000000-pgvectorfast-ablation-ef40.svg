<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Where pgvectorfast's speedup comes from</title>
<desc id="d">stock pgvector 0.8.7: 1,099 QPS at 1 client, 7,895 at 8, 5.07M cycles and 1.95M instructions per query; + rewritten search loop, SIMD: 1,134 QPS at 1 client, 7,866 at 8, 4.92M cycles and 1.85M instructions per query; + Calico page translation: 1,780 QPS at 1 client, 11,624 at 8, 3.11M cycles and 1.64M instructions per query; + optimistic reads (no pins, locks): 3,223 QPS at 1 client, 17,760 at 8, 1.70M cycles and 0.65M instructions per query; + neighbour prefetch  = pgvectorfast: 9,476 QPS at 1 client, 37,876 at 8, 0.54M cycles and 0.71M instructions per query</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--bar:#2a78d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--bar:#3987e5}}
:root[data-theme="dark"]{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--bar:#3987e5}
.bg{fill:var(--surface)} .ttl{fill:var(--ink);font-size:19px;font-weight:600}.sub{fill:var(--ink2);font-size:12.5px} .foot{fill:var(--muted);font-size:11.5px}.ptl{fill:var(--ink);font-size:13px;font-weight:600}.row{fill:var(--ink);font-size:12.5px;font-weight:500}.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.val{fill:var(--ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}.note{fill:var(--muted);font-weight:500}.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}.bar{fill:var(--bar)} .bar:hover{opacity:.8}
</style>
<rect class="bg" x="0" y="0" width="1060" height="560"/>
<text class="ttl" x="24" y="34">Where pgvectorfast's speedup over pgvector comes from</text>
<text class="sub" x="24" y="56">HNSW on 18M BIGANN, ef_search=40, recall 0.855 in every arm · each row adds one layer to the row above · same index, fully in shared_buffers</text>
<text class="sub" x="24" y="74">Grey figures are the step over the row above. Hover a bar for its value.</text>
<text class="row" x="254" y="137.0" text-anchor="end">stock pgvector 0.8.7</text>
<text class="row" x="254" y="167.0" text-anchor="end">+ rewritten search loop, SIMD</text>
<text class="row" x="254" y="197.0" text-anchor="end">+ Calico page translation</text>
<text class="row" x="254" y="227.0" text-anchor="end">+ optimistic reads (no pins, locks)</text>
<text class="row" x="254" y="257.0" text-anchor="end">+ neighbour prefetch  = pgvectorfast</text>
<text class="row" x="254" y="361.0" text-anchor="end">stock pgvector 0.8.7</text>
<text class="row" x="254" y="391.0" text-anchor="end">+ rewritten search loop, SIMD</text>
<text class="row" x="254" y="421.0" text-anchor="end">+ Calico page translation</text>
<text class="row" x="254" y="451.0" text-anchor="end">+ optimistic reads (no pins, locks)</text>
<text class="row" x="254" y="481.0" text-anchor="end">+ neighbour prefetch  = pgvectorfast</text>
