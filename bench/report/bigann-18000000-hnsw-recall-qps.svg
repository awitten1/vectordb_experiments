<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Recall vs throughput for HNSW on bigann_18000000</title>
<desc id="d">Single-client recall/throughput tradeoff. ef_search 10: recall 0.6212, 2,551 QPS; ef_search 20: recall 0.7494, 1,721 QPS; ef_search 40: recall 0.8541, 1,092 QPS; ef_search 80: recall 0.9281, 636 QPS; ef_search 160: recall 0.9683, 363 QPS; ef_search 320: recall 0.9893, 201 QPS.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--series:#2a78d6;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--series:#3987e5;}}
:root[data-theme="dark"]{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--series:#3987e5;}
.bg{fill:var(--surface)}
.ttl{fill:var(--ink);font-size:19px;font-weight:600}
.sub{fill:var(--ink2);font-size:12.5px}
.foot{fill:var(--muted);font-size:11.5px}
.axlbl{fill:var(--ink2);font-size:12.5px;font-weight:500}
.tick{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.line{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.plbl{fill:var(--ink);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
